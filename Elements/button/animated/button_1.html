<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Button Styles</title>
  <style>
    .button {
      border: none;
      color: #000000;
      text-align: center;
      font-size: 18px;
      padding: 20px;
      width: 200px;
      transition: all 0.3s ease;
      cursor: pointer;
      margin: 5px;
      font-family: Eina01, sans-serif;
      font-weight: 800;
      position: relative;
      z-index: 0;
      border-radius: 6px; /* Στρογγυλεμένες άκρες */
      background-color: white; /* Αρχικό χρώμα φόντου */
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2); /* Ελαφριά σκιά γύρω από το κουμπί */
    }

    .button:before,
    .button:after {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #000000;
      border-radius: 6px; /* Στρογγυλεμένες άκρες */
      transition: all 0.3s ease;
      z-index: -1; /* Σκιά πίσω από το κουμπί */
    }

    .button:before {
      top: -5px;
      left: -5px;
    }

    .button:after {
      bottom: -5px;
      right: -5px;
    }

    /* Εφέ κατά το hover */
    .button:hover {
      background-color: #00000000; /* Χρώμα φόντου κατά το hover */
      color: rgb(0, 0, 0);
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.3); /* Ενίσχυση σκιάς */
    }

    .button:hover:before,
    .button:hover:after {
      width: 140%; /* Κάνε τις γραμμές ακόμα μεγαλύτερες */
      height: 140%;
      top: -15px; /* Σπρώξε τις γραμμές πιο έξω */
      left: -15px;
      bottom: -15px;
      right: -15px;
      border-color: #ffffff; /* Αλλάξτε το χρώμα των γραμμών κατά το hover */
      box-shadow: 0 0 10px 3px rgba(255, 255, 255, 0.7); /* Φωτισμός γύρω από τις γραμμές */
    }

  </style>
</head>
<body>

  <button class="button">Button</button>

</body>
</html>
